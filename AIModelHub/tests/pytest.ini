[pytest]
# Diretório raiz dos testes
testpaths = tests

# Padrão de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores disponíveis
markers =
    unit: Testes unitários isolados
    integration: Testes de integração entre módulos
    performance: Testes de performance e benchmark
    slow: Testes que demoram mais que o normal

# Opções padrão
addopts =
    --verbose
    --tb=short
    --strict-markers
    --cov=AIModelHub
    --cov-report=term-missing
    --cov-report=html:tests/coverage_report
    --cov-fail-under=70

# Cobertura — módulos a monitorar
[coverage:run]
source = .
omit =
    tests/*
    */__init__.py
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass